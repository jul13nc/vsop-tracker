name: Deploy Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - supabase/config.toml
      - .github/workflows/deploy-supabase.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Afficher les migrations à appliquer sans modifier la base"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: |
          supabase link \
            --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Preview migrations
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply migrations
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
