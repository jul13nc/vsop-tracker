name: Reset Supabase cloud database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Ce reset efface toutes les données du projet cloud"
        type: choice
        required: true
        options:
          - NO
          - RESET

permissions:
  contents: read

concurrency:
  group: supabase-cloud-reset
  cancel-in-progress: false

jobs:
  reset:
    if: inputs.confirmation == 'RESET'
    runs-on: ubuntu-latest
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project and reset database
        run: |
          supabase link \
            --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" \
            --password "$SUPABASE_DB_PASSWORD"
          supabase db reset --linked --yes